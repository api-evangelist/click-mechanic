name: Click Mechanic
description: >-
  ClickMechanic is the UK's leading online car-repair marketplace, founded in
  2012, that connects car owners with vetted mobile mechanics and independent
  garages for repairs, servicing, diagnostics, and MOTs. Customers enter their
  registration and symptoms to get an instant fixed-price quote, then book a
  vetted mechanic for same- or next-day work at home or the roadside, with
  payment taken only after the job is completed. Surfaced as a portfolio company
  of 500 Global. ClickMechanic operates a consumer- and mechanic-facing web
  platform (Ruby on Rails on Heroku) and publishes no public developer API,
  developer portal, SDK, or machine-readable API catalog at this time; this
  profile captures its public identity and web properties for the API Evangelist
  network.
